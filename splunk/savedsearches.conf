# Tags: altiward
[Altiward - Permanent admin use]
description = Use of permanent admin accounts in the last 30 days: signing in to (at the Mac, in Terminal or over SSH), approving an authorisation prompt as, or using screen sharing as an account that is always an administrator. A sign-in's start and end are one row (ended is empty while it is open); on_session_of is the user whose session it was, if known. sudo, su and SSH file copies or one-off commands are not recorded until Apple grants the Endpoint Security entitlement. Evidence for review, not an alert: Altiward records these from macOS's own logs, which an administrator can erase.
search = sourcetype="altiward:ocsf" class_uid=3002 unmapped.altiward.event_type="admin.permanent_use" earliest=-30d \
| stats min(start_time) as started max(end_time) as ended values(unmapped.altiward.detail.method) as method values(unmapped.altiward.detail.on_session_of) as on_session_of latest(message) as message by metadata.correlation_uid host user.name \
| sort 0 - started \
| eval started=strftime(started/1000, "%Y-%m-%d %H:%M:%S"), ended=strftime(ended/1000, "%Y-%m-%d %H:%M:%S") \
| table started ended host user.name method on_session_of message metadata.correlation_uid
dispatch.earliest_time = -30d
dispatch.latest_time = now
cron_schedule = 0 7 * * *
enableSched = 0

# Tags: altiward
[Altiward - Device key replaced without approval]
description = A new key replaced a Mac's active key without approval. This only happens when re-enrolment approval is off. Check whether the owner expected the reinstall or key change and compare independent inventory. If unexpected, revoke the new key, enable approval and rotate the enrolment token. Hardware UUIDs are client claims.
search = sourcetype="altiward:ocsf" class_uid=6003 unmapped.altiward.event_type="agent.enrollment" unmapped.altiward.detail.state="replaced" \
| table _time metadata.tenant_uid host actor.user.name unmapped.altiward.detail.device_id unmapped.altiward.detail.previous_device_id unmapped.altiward.detail.hardware_uuid_matches unmapped.altiward.detail.key_storage message
dispatch.earliest_time = -20m@m
dispatch.latest_time = -5m@m
cron_schedule = */15 * * * *
enableSched = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 5
alert.suppress = 0

# Tags: altiward
[Altiward - Device key waiting for approval]
description = A new key is waiting for approval. This can be normal after a reinstall, and for every new Mac when Approve every new Mac is on in Altiward. Before approving, check the Mac's last check-in in Altiward, HardwareUuidMatches and whether its owner expects the change. An empty HardwareUuidMatches means there was no active key to compare, as for a new Mac. Hardware UUIDs are client claims, not proof of the Mac's identity.
search = sourcetype="altiward:ocsf" class_uid=6003 unmapped.altiward.event_type="agent.enrollment" unmapped.altiward.detail.state="pending" \
| table _time metadata.tenant_uid host actor.user.name unmapped.altiward.detail.device_id unmapped.altiward.detail.previous_device_id unmapped.altiward.detail.hardware_uuid_matches unmapped.altiward.detail.key_storage message
dispatch.earliest_time = -20m@m
dispatch.latest_time = -5m@m
cron_schedule = */15 * * * *
enableSched = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.suppress = 0

# Tags: altiward
[Altiward - Rotated device key used]
description = A device key that the Mac had already replaced by rotation was used again. Two copies of one Mac's device key exist: the Mac's, and a copy made from a backup, a disk image or a migration. When revoked_device_id is set, Altiward has revoked the lineage's key, so neither holder has a working key, and the Mac enrols again by itself. When it is empty, nothing was revoked: the key was replaced more than 30 days ago, or this key already caused a revocation. A copy carries the Mac's serial number and hardware UUID, so they don't tell its key from the Mac's. Run altiward-agent status on the Mac through your MDM, approve only the pending key whose fingerprint in Enrollments matches the key fingerprint it prints, and reject the others. When revoked_device_id is empty and the pending key is the Mac's, the active key, if there is one, isn't the Mac's: revoke it, then approve the Mac's key. Look for where the copy came from: backups, disk images and Migration Assistant. A Mac restored from a backup older than its last rotation also raises this alert, and its fresh key is genuine.
search = sourcetype="altiward:ocsf" class_uid=6003 unmapped.altiward.event_type="agent.enrollment" unmapped.altiward.detail.state="rotated_key_used" \
| table _time metadata.tenant_uid host unmapped.altiward.detail.device_id unmapped.altiward.detail.key_fingerprint unmapped.altiward.detail.rotated_to unmapped.altiward.detail.revoked_device_id message
dispatch.earliest_time = -20m@m
dispatch.latest_time = -5m@m
cron_schedule = */15 * * * *
enableSched = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 5
alert.suppress = 0

# Tags: altiward
[Altiward - Enrolment bursts]
description = Successful enrolments of at least 10 distinct claimed serials from one token in the last hour. Tune min_new_macs to your rollout. Check independent inventory: invented serials can consume the allowance. Exact retries do not add Macs to the count. Token is a fingerprint, not the secret.
search = sourcetype="altiward:ocsf" class_uid=6003 unmapped.altiward.event_type="agent.enrollment" unmapped.altiward.detail.state="enrolled" unmapped.altiward.detail.token="*" earliest=-1h \
| stats min(_time) as first_seen max(_time) as last_seen dc(device.hw_info.serial_number) as new_macs values(device.hw_info.serial_number) as macs by metadata.tenant_uid unmapped.altiward.detail.token \
| eval min_new_macs=10 \
| where new_macs >= min_new_macs \
| sort 0 - new_macs
dispatch.earliest_time = -1h
dispatch.latest_time = now
cron_schedule = 0 * * * *
enableSched = 0
