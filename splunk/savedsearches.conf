# Tags: altiward, forwarder
[Altiward - Frequent elevations]
description = More than 10 elevations by one user in 7 days. Works with the Altiward agent's events and altiward-forwarder's.
search = sourcetype="altiward:ocsf" class_uid=3005 activity_id=1 status_id=1 earliest=-7d \
| stats count by user.name | where count > 10
dispatch.earliest_time = -7d@d
dispatch.latest_time = @d
cron_schedule = 0 6 * * *
enableSched = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 3
alert.suppress = 0

# Tags: altiward, forwarder
[Altiward - Admin time per user per day]
description = One user's admin time in the last complete UTC day above max_admin_minutes: 120 by default; set it to SAP Privileges' AdminBudget to match it. _time is the day's start. An elevation lasts until the next grant or revoke for that user on that Mac, or until now; one that crosses midnight counts towards each day for its part in it. Works with the Altiward agent's events and altiward-forwarder's, whose elevations count up to their expiry at most.
search = sourcetype="altiward:ocsf" class_uid=3005 status_id=1 (activity_id=1 OR activity_id=2) earliest=-3d \
| eval day_end=floor(now()/86400)*86400, day_start=day_end-86400 \
| sort 0 - _time \
| streamstats current=f last(_time) as next_time by device.uid user.name \
| where activity_id=1 \
| eval end=coalesce(next_time, now()) \
| eval end=if('metadata.product.name'="Altiward Forwarder" AND isnotnull('unmapped.altiward.expires_time'), min(end, 'unmapped.altiward.expires_time'/1000), end) \
| eval minutes=(min(end, day_end) - max(_time, day_start))/60, mac=coalesce('device.hw_info.serial_number', 'device.uid') \
| where minutes > 0 \
| stats sum(minutes) as admin_minutes count as elevations values(mac) as macs by user.name day_start \
| eval admin_minutes=round(admin_minutes), _time=day_start \
| eval max_admin_minutes=120 \
| where admin_minutes > max_admin_minutes \
| table _time user.name admin_minutes elevations macs
dispatch.earliest_time = -3d
dispatch.latest_time = now
cron_schedule = 0 6 * * *
enableSched = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 3
alert.suppress = 0

