# Saved searches for Altiward events (sourcetype altiward:ocsf). They're off until you
# enable them: copy this file to $SPLUNK_HOME/etc/apps/<your app>/local/, then in Splunk
# Web, Settings > Searches, reports, and alerts, enable the ones you want and add an alert
# action. Each search's text is also in searches/, to paste into Search.
#
# The "Tags:" line above each stanza says whose events it works on: altiward (the Altiward
# server) or forwarder (altiward-forwarder too). CI checks it against example records.

# Tags: altiward
[Altiward - Admin rights not granted by SAP Privileges]
description = An account became an admin without SAP Privileges granting it, and nothing has explained it yet. Making the account a permanent admin in Altiward, or a Privileges grant, explains it and closes the finding. Removing the rights closes it too, with status "Rights removed", but still alerts once.
search = sourcetype="altiward:ocsf" class_uid=2004 finding_info.analytic.name="altiward.admin_out_of_band" \
| stats values(activity_name) as acts latest(activity_name) as last latest(status) as status latest(_time) as _time latest(user.name) as user latest(message) as message by finding_info.uid host \
| where isnotnull(mvfind(acts, "^Create$")) AND (last="Create" OR status="Rights removed")
dispatch.earliest_time = -1h@h
dispatch.latest_time = @h
cron_schedule = 5 * * * *
enableSched = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 5
alert.suppress = 0

# Tags: altiward
[Altiward - Admin rights after expiry]
description = Admin rights still held after SAP Privileges' expiry, usually because its timer was stopped. Raised whether or not Altiward removed them: severity_id 4 means it couldn't.
search = sourcetype="altiward:ocsf" class_uid=2004 finding_info.analytic.name="altiward.rights_after_expiry" \
| table _time host user.name severity message
dispatch.earliest_time = -1h@h
dispatch.latest_time = @h
cron_schedule = 5 * * * *
enableSched = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.suppress = 0

# Tags: altiward
[Altiward - Tamper checks failing]
description = Altiward agent integrity checks failing now. A failure and its fix share finding_info.uid, so only findings whose latest record is still open are kept. Refused or unconfirmed grant claims are left out: the "Grant claims refused or not confirmed" alert covers them.
search = sourcetype="altiward:ocsf" class_uid=2004 finding_info.analytic.name="altiward.tamper.*" finding_info.analytic.name!="altiward.tamper.grant_claim" \
| stats latest(activity_name) as last latest(message) as message latest(severity) as severity by finding_info.uid host \
| where last="Create"
dispatch.earliest_time = -1h@h
dispatch.latest_time = @h
cron_schedule = 5 * * * *
enableSched = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.suppress = 0

# Tags: altiward
[Altiward - Grant claims refused or not confirmed]
description = Claims from SAP Privileges' hook that the Altiward agent refused, or accepted without Privileges' own log backing them: someone holding admin rights may have run the hook by hand to make them look granted. kind is grant, renewal or give_back; outcome is refused or accepted_unconfirmed.
search = sourcetype="altiward:ocsf" class_uid=2004 finding_info.analytic.name="altiward.tamper.grant_claim" \
| table _time host unmapped.altiward.detail.user unmapped.altiward.detail.kind unmapped.altiward.detail.outcome unmapped.altiward.detail.reason unmapped.altiward.detail.caller_uid message
dispatch.earliest_time = -20m@m
dispatch.latest_time = -5m@m
cron_schedule = */15 * * * *
enableSched = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 5
alert.suppress = 0

