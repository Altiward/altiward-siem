# Saved searches for Altiward events (sourcetype altiward:ocsf). They're off until you
# enable them: copy this file to $SPLUNK_HOME/etc/apps/<your app>/local/, then in Splunk
# Web, Settings > Searches, reports, and alerts, enable the ones you want and add an alert
# action. Each search's text is also in searches/, to paste into Search.
#
# The "Tags:" line above each stanza says whose events it works on: altiward (the Altiward
# server) or forwarder (altiward-forwarder too). CI checks it against example records.

# Tags: altiward
[Altiward - Admin rights not granted by SAP Privileges]
description = An account became an admin without SAP Privileges granting it, and nothing has explained it yet. Making the account a permanent admin in Altiward closes the finding.
search = sourcetype="altiward:ocsf" class_uid=2004 finding_info.analytic.name="altiward.admin_out_of_band" \
| stats latest(activity_name) as last latest(_time) as _time latest(user.name) as user latest(message) as message by finding_info.uid host \
| where last="Create"
dispatch.earliest_time = -1h@h
dispatch.latest_time = @h
cron_schedule = 5 * * * *
enableSched = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 5
alert.suppress = 0

# Tags: altiward
[Altiward - Admin rights after expiry]
description = Admin rights still held after SAP Privileges' expiry, usually because its timer was stopped. Raised whether or not Altiward removed them: severity_id 4 means it couldn't.
search = sourcetype="altiward:ocsf" class_uid=2004 finding_info.analytic.name="altiward.rights_after_expiry" \
| table _time host user.name severity message
dispatch.earliest_time = -1h@h
dispatch.latest_time = @h
cron_schedule = 5 * * * *
enableSched = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.suppress = 0

# Tags: altiward
[Altiward - Tamper checks failing]
description = Altiward agent integrity checks failing now. A failure and its fix share finding_info.uid, so only findings whose latest record is still open are kept.
search = sourcetype="altiward:ocsf" class_uid=2004 finding_info.analytic.name="altiward.tamper.*" \
| stats latest(activity_name) as last latest(message) as message latest(severity) as severity by finding_info.uid host \
| where last="Create"
dispatch.earliest_time = -1h@h
dispatch.latest_time = @h
cron_schedule = 5 * * * *
enableSched = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.suppress = 0

# Tags: altiward
[Altiward - Persistence while admin]
description = Persistence that appeared while someone was admin. Each file is in evidences{}.file.path, to look up in your EDR's data for the same Mac.
search = sourcetype="altiward:ocsf" class_uid=2004 finding_info.analytic.name="altiward.persistence_detected" \
| table _time host user.name metadata.correlation_uid evidences{}.file.path message
dispatch.earliest_time = -1h@h
dispatch.latest_time = @h
cron_schedule = 5 * * * *
enableSched = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 5
alert.suppress = 0

# Tags: altiward
[Altiward - Local account created while admin]
description = A new local account appeared while someone was admin: Admin account created (severity_id 4) or Local account created. user.name is who was admin, not necessarily who made it.
search = sourcetype="altiward:ocsf" class_uid=2004 finding_info.analytic.name="altiward.account_created" \
| table _time host user.name evidences{}.user.name severity message
dispatch.earliest_time = -1h@h
dispatch.latest_time = @h
cron_schedule = 5 * * * *
enableSched = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 5
alert.suppress = 0

# Tags: altiward
[Altiward - Macs that stopped checking in]
description = Macs the Altiward server hasn't heard from (the agent may have been removed). The Mac checking in again closes the finding with the same finding_info.uid.
search = sourcetype="altiward:ocsf" class_uid=2004 finding_info.analytic.name="altiward.agent_silent" \
| stats latest(activity_name) as last latest(message) as message by finding_info.uid host \
| where last="Create"
dispatch.earliest_time = -1h@h
dispatch.latest_time = @h
cron_schedule = 5 * * * *
enableSched = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.suppress = 0

# Tags: altiward
[Altiward - Contradicted grants and revokes]
description = Grant or revoke reports the Mac's admin group contradicts: possible tampering with SAP Privileges' report.
search = sourcetype="altiward:ocsf" class_uid=3005 status_id=1 severity_id>=3 \
| table _time host user.name activity_name status_detail
dispatch.earliest_time = -1h@h
dispatch.latest_time = @h
cron_schedule = 5 * * * *
enableSched = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.suppress = 0

# Tags: altiward
[Altiward - Break-glass token use]
description = Console actions taken with the break-glass token, which works while single sign-on is on. actor.user.name is break-glass: and the token's fingerprint.
search = sourcetype="altiward:ocsf" class_uid=6003 actor.user.name="break-glass:*" \
| table _time actor.user.name api.operation message
dispatch.earliest_time = -1h@h
dispatch.latest_time = @h
cron_schedule = 5 * * * *
enableSched = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.suppress = 0

# Tags: altiward, forwarder
[Altiward - Frequent elevations]
description = More than 10 elevations by one user in 7 days. Works with the Altiward agent's events and altiward-forwarder's.
search = sourcetype="altiward:ocsf" class_uid=3005 activity_id=1 status_id=1 earliest=-7d \
| stats count by user.name | where count > 10
dispatch.earliest_time = -7d@d
dispatch.latest_time = @d
cron_schedule = 0 6 * * *
enableSched = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 3
alert.suppress = 0

# Tags: altiward
[Altiward - Console actions]
description = Who revoked admin rights, approved enrollments or changed settings in the Altiward console. actor.user.name is the person's email with single sign-on, otherwise a console token's fingerprint.
search = sourcetype="altiward:ocsf" class_uid=6003 \
| table _time actor.user.name api.operation message
dispatch.earliest_time = -24h@h
dispatch.latest_time = @h
cron_schedule = 0 7 * * *
enableSched = 0

# Tags: altiward
[Altiward - Console sign-ins]
description = Single sign-on to the Altiward console: sign-ins, with the role given, and sign-outs.
search = sourcetype="altiward:ocsf" class_uid=3002 service.name="Altiward console" \
| table _time user.name activity_name message
dispatch.earliest_time = -24h@h
dispatch.latest_time = @h
cron_schedule = 0 7 * * *
enableSched = 0

# Tags: altiward, forwarder
[Altiward - Elevations]
description = Admin rights granted through SAP Privileges: the reason given, when they expire, and which product reported it (Altiward or Altiward Forwarder).
search = sourcetype="altiward:ocsf" class_uid=3005 activity_id=1 \
| table _time host device.uid user.name unmapped.altiward.reason unmapped.altiward.expires_time metadata.product.name message
dispatch.earliest_time = -24h@h
dispatch.latest_time = @h
cron_schedule = 0 7 * * *
enableSched = 0
