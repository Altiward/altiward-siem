id: 0189bbb2-3420-4ccf-b637-a2bcb3a79a94
name: "Altiward: more than 10 elevations by one user in 7 days"
description: |
  One person asked SAP Privileges for admin rights more than 10 times in 7 days. Either
  they need a different way to do their work, or the rights are being used for something
  else. Works with the Altiward agent's events and altiward-forwarder's.
severity: Low
requiredDataConnectors: []
queryFrequency: 1d
queryPeriod: 7d
triggerOperator: gt
triggerThreshold: 0
tactics:
  - PrivilegeEscalation
relevantTechniques:
  - T1078.003
query: |
  AltiwardOCSF_CL
  | where ClassUid == 3005 and ActivityId == 1 and toint(Ocsf.status_id) == 1
  | summarize Elevations = count() by UserName
  | where Elevations > 10
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: UserName
tags:
  - altiward
  - forwarder
version: 1.0.0
kind: Scheduled
