name: Release

# Publishes a GitHub release when a vX.Y.Z tag is pushed: the checks, then the release with
# its CHANGELOG.md section as notes and the ARM template behind the Deploy to Azure button
# attached. The checksums are signed keylessly by this workflow's GitHub identity and
# verified before a separate job can publish the files.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # keyless signing, only in this job
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Release notes (refuses a version without a dated CHANGELOG section)
        id: version
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must be vX.Y.Z, got $GITHUB_REF_NAME"; exit 1; }
          mkdir -p "$RUNNER_TEMP/release"
          scripts/release-notes.sh "$v" > "$RUNNER_TEMP/release/RELEASE_NOTES.md"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # a release builds from nothing a cache could have changed
      - name: Checks
        run: make lint test check

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the checksums and verify the release files
        run: |
          cp sentinel/azuredeploy.json "$RUNNER_TEMP/release/"
          cd "$RUNNER_TEMP/release"
          sha256sum azuredeploy.json RELEASE_NOTES.md > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Reject changed files, changed checksums and a different signing identity
        run: |
          mkdir -p "$RUNNER_TEMP/negative"
          cp "$RUNNER_TEMP/release/"* "$RUNNER_TEMP/negative/"
          cd "$RUNNER_TEMP/negative"
          printf '\nchanged\n' >> azuredeploy.json
          if sha256sum -c SHA256SUMS; then
            echo "Changed release file was accepted" >&2; exit 1
          fi
          printf '\nchanged\n' >> SHA256SUMS
          if cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS; then
            echo "Changed checksums were accepted" >&2; exit 1
          fi
          cp "$RUNNER_TEMP/release/SHA256SUMS" SHA256SUMS
          if cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/not-this-release.yml@$GITHUB_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS; then
            echo "Different signing identity was accepted" >&2; exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: altiward-siem-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/release/*
          retention-days: 90

  # The only job that can write to the repository publishes the already verified files.
  publish:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: altiward-siem-${{ needs.sign.outputs.version }}
          path: files

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" files/* \
            --verify-tag --title "$TAG" --notes-file files/RELEASE_NOTES.md

  # Starts the Azure deploy check for this release, on main with the tag as its input, so
  # the azure-test environment (main only) is the one place the Azure sign-in can run.
  azure-deploy-check:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: write # start a workflow_dispatch run
    steps:
      - name: Start the Azure deploy check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh workflow run azure-deploy-check.yml --ref main -f tag="$TAG"
